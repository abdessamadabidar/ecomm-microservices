server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ecomm_payment_db
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer

      properties:
        "[spring.json.use.type.headers]": false
        "[spring.json.value.default.type]": "com.ecomm.payment_service.event.PaymentRequestedEvent"

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer

      properties:
        "[spring.json.type.mapping]": "payment-completed:com.ecomm.payment_service.event.PaymentCompletedEvent,payment-failed:com.ecomm.payment_service.event.PaymentFailedEvent"
