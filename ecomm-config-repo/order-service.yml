server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ecomm_order_db
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer:
        org.apache.kafka.common.serialization.StringSerializer

      value-serializer:
        org.springframework.kafka.support.serializer.JsonSerializer

      properties:
        "[spring.json.add.type.headers]": true
        "[spring.json.type.mapping]": "order-created:com.ecomm.order_service.event.OrderCreatedEvent"

    consumer:
      group-id: order-service
      auto-offset-reset: earliest

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer

      properties:
        "[spring.json.trusted.packages]": "com.ecomm.order_service.event"
        "[spring.json.type.mapping]": "payment-completed:com.ecomm.order_service.event.PaymentCompletedEvent,payment-failed:com.ecomm.order_service.event.PaymentFailedEvent"

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

      client:
        config:
          product-service:
            connect-timeout: 2000
            read-timeout: 3000

resilience4j:
  circuitbreaker:
    instances:

      productServiceGetProduct:
        register-health-indicator: true
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true