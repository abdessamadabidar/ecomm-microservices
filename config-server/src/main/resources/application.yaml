server:
  port: 8888

spring:
  application:
    name: config-server

  profiles:
    active: ${CONFIG_SERVER_PROFILE:native}

  cloud:
    config:
      server:
        native:
          search-locations: ${CONFIG_REPO_LOCATION:file:../ecomm-config-repo/}
        git:
          uri: ${CONFIG_REPO_URI:file:../ecomm-config-repo}
          default-label: master

management:
  endpoints:
    web:
      exposure:
        include: health,info
