apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-connect
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-connect
  template:
    metadata:
      labels:
        app: kafka-connect
    spec:
      containers:
        - name: kafka-connect
          image: {{ .Values.kafkaConnect.image | quote }}
          ports:
            - name: rest
              containerPort: {{ .Values.kafkaConnect.port }}
          env:
            - name: CONNECT_LISTENERS
              value: "http://0.0.0.0:{{ .Values.kafkaConnect.port }}"
            - name: CONNECT_REST_ADVERTISED_PORT
              value: {{ .Values.kafkaConnect.port | quote }}
            - name: BOOTSTRAP_SERVERS
              value: {{ .Values.kafkaConnect.bootstrapServers | quote }}
            - name: GROUP_ID
              value: "ecomm-connect"
            - name: CONFIG_STORAGE_TOPIC
              value: "ecomm-connect-configs"
            - name: OFFSET_STORAGE_TOPIC
              value: "ecomm-connect-offsets"
            - name: STATUS_STORAGE_TOPIC
              value: "ecomm-connect-status"
            - name: CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: CONNECT_STATUS_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: CONNECT_KEY_CONVERTER
              value: "org.apache.kafka.connect.storage.StringConverter"
            - name: CONNECT_VALUE_CONVERTER
              value: "org.apache.kafka.connect.json.JsonConverter"
            - name: CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE
              value: "false"
            - name: ADVERTISED_HOST_NAME
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          readinessProbe:
            httpGet:
              path: /
              port: rest
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-connect
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: kafka-connect
  ports:
    - name: rest
      port: {{ .Values.kafkaConnect.port }}
      targetPort: rest