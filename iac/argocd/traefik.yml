apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: "42.3.1"
    helm:
      valuesObject:
        ingressClass:
          enabled: true
          name: traefik
          isDefaultClass: false
        providers:
          kubernetesIngress:
            enabled: true
        service:
          spec:
            type: LoadBalancer

  destination:
    server: https://kubernetes.default.svc
    namespace: ingress

  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true