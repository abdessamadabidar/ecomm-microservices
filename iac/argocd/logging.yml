apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecomm-logging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/abdessamadabidar/ecomm-microservices.git
    targetRevision: master
    path: iac/helm/helm-logging
  destination:
    server: https://kubernetes.default.svc
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true