trigger:
  - master

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - task: JavaToolInstaller@0
    displayName: Use Java 21
    inputs:
      versionSpec: '21'
      jdkArchitectureOption: x64
      jdkSourceOption: PreInstalled
  
  - bash: |
      set -e
      for service in config-server discovery-service product-service \
                      order-service payment-service notification-service \
                      api-gateway
      do
        mvn -B -f "$service/pom.xml" clean verify \
          '-Dsurefire.excludes=**/*ApplicationTests.java'
      done
    displayName: Build and test backend services

  - task: AzureCLI@2
    displayName: Build and push application images
    inputs:
      azureSubscription: azure-ecomm-dev
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -e

        ACR_NAME="EcommContainerRegistry1"
        REGISTRY=$(az acr show --name "$ACR_NAME" \
          --query loginServer --output tsv)

        az acr login --name "$ACR_NAME"

        for service in config-server discovery-service product-service \
                      order-service payment-service notification-service \
                      api-gateway
        do
          IMAGE="$REGISTRY/$service:$BUILD_BUILDID"

          docker build -t "$IMAGE" "./$service"

          docker push "$IMAGE"
        done

        IMAGE="$REGISTRY/frontend:$BUILD_BUILDID"

        docker build -t "$IMAGE" ./frontend
        docker push "$IMAGE"

  - task: HelmInstaller@1
    displayName: Install Helm
    inputs:
      helmVersionToInstall: '3.17.3'
    
  
  - task: AzureCLI@2
    displayName: Install Argo CD with Ansible
    inputs:
      azureSubscription: azure-ecomm-dev
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -e
        
        python3 -m venv .venv-ansible
        source .venv-ansible/bin/activate
        pip install ansible-core

        ansible-galaxy collection install kubernetes.core

        az aks get-credentials \
          --resource-group rg-ecomm-dev \
          --name aks-ecomm-dev \
          --admin

        ansible-playbook \
          -i iac/ansible/inventory.ini \
          iac/ansible/install-argocd.yml