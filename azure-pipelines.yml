trigger:
  - master

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - task: JavaToolInstaller@0
    displayName: Use Java 21
    inputs:
      versionSpec: '21'
      jdkArchitectureOption: x64
      jdkSourceOption: PreInstalled
  - bash: |
      set -e
      for service in config-server discovery-service product-service \
                      order-service payment-service notification-service \
                      api-gateway
      do
        mvn -B -f "$service/pom.xml" clean verify \
          '-Dsurefire.excludes=**/*ApplicationTests.java'
      done
    displayName: Build and test backend services
